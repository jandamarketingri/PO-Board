<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J&amp;A PO Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky control bar, status summary, then one horizontal lane per printer holding wrapped PO tickets (the whiteboard, made searchable). */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --ink: #18212c;
  --muted: #5b6676;
  --line: #cfd6de;
  --note: #ffe8d4;
  --note-edge: #f2c9a6;
  --accent: #c4500f;
  --accent-ink: #ffffff;
  --ok: #217a4f;
  --ok-bg: #dcf1e5;
  --part: #2a63a8;
  --part-bg: #dde9f8;
  --warn: #9a6400;
  --warn-bg: #fdefc9;
  --late: #b4302a;
  --late-bg: #fbe0dd;
  --shadow: 0 1px 0 rgba(24,33,44,.06), 0 2px 6px rgba(24,33,44,.08);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1b222b; --ink: #e6ebf0; --muted: #98a3b1; --line: #2e3844;
    --note: #3a2a1e; --note-edge: #5a3d27; --accent: #f08a45; --accent-ink: #1a0d03;
    --ok: #6fd3a0; --ok-bg: #173527; --part: #8cb8ef; --part-bg: #1a2b42;
    --warn: #f1c35c; --warn-bg: #3a2e12; --late: #f2887f; --late-bg: #401c19;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1b222b; --ink: #e6ebf0; --muted: #98a3b1; --line: #2e3844;
  --note: #3a2a1e; --note-edge: #5a3d27; --accent: #f08a45; --accent-ink: #1a0d03;
  --ok: #6fd3a0; --ok-bg: #173527; --part: #8cb8ef; --part-bg: #1a2b42;
  --warn: #f1c35c; --warn-bg: #3a2e12; --late: #f2887f; --late-bg: #401c19;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.modal-card label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.who { font-size: 13px; color: var(--muted); }
@media (max-width: 1500px) { .who { display: none; } }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand .sub { color: var(--muted); font-size: 13px; }
.search { flex: 1 1 220px; max-width: 340px; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; max-width: 100%; }
.seg button { white-space: nowrap; flex: 1 0 auto; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 36px; padding: 0; justify-content: center; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

/* summary */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; display: grid; gap: 18px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-size: 14px; color: var(--muted); }
.summary b { font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.summary .late b { color: var(--late); }
.summary .imported { margin-left: auto; font-size: 13px; }

/* lanes */
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.lane-head { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 12px 14px; text-align: left; }
.lane-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: .02em; }
.lane-head .vno { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lane-head .counts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.lane-head .caret { color: var(--muted); transition: transform .15s; }
.lane[data-collapsed="true"] .caret { transform: rotate(-90deg); }
.lane[data-collapsed="true"] .cards { display: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.lane-empty { padding: 0 14px 14px; color: var(--muted); font-size: 14px; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.sent { background: var(--bg); color: var(--muted); }
.pill.partial { background: var(--part-bg); color: var(--part); }
.pill.received, .pill.closed { background: var(--ok-bg); color: var(--ok); }
.pill.late { background: var(--late-bg); color: var(--late); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

/* ticket */
.card { position: relative; display: grid; gap: 6px; text-align: left; background: var(--note); border: 1px solid var(--note-edge); border-radius: 3px; padding: 10px 11px 9px; box-shadow: var(--shadow); min-width: 0; }
.card:hover { border-color: var(--accent); }
.card.done { opacity: .72; }
.c-top { display: flex; align-items: center; gap: 6px; }
.c-po { font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.c-star { margin-left: auto; color: var(--accent); font-size: 15px; line-height: 1; }
.c-title { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-more { font-size: 12px; color: var(--muted); }
.c-ship { font-size: 12px; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--part); }
.meter.full i { background: var(--ok); }
.c-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; white-space: nowrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-foot .qty { margin-left: auto; font-family: var(--f-mono); }
.age { font-weight: 600; }
.age.warn { color: var(--warn); }
.age.late { color: var(--late); }
.c-stages { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--surface); color: var(--ink); border: 1px solid var(--note-edge); }
.c-eta { justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: var(--surface); border: 1px solid var(--note-edge); font-variant-numeric: tabular-nums; }
.c-eta.past { background: var(--late-bg); border-color: var(--late); color: var(--late); }
.eta-row input[type=date] { height: 36px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--bg); }
.c-note { font-size: 12px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* empty */
.empty { background: var(--surface); border: 2px dashed var(--line); border-radius: 8px; padding: 40px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--f-display); font-size: 24px; margin: 0; text-transform: uppercase; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.38); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.18);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.d-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font-family: var(--f-mono); font-size: 22px; }
.d-head .meta { color: var(--muted); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.d-head .x { margin-left: auto; }
.d-body { overflow-y: auto; padding: 16px 18px 28px; display: grid; gap: 20px; align-content: start; }
.d-sec h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 10px; font-weight: 600; font-size: 13px; }
.toggle[aria-pressed="true"] { background: var(--note); border-color: var(--accent); color: var(--ink); }
.toggle[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
textarea { width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.design { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.design + .design { margin-top: 10px; }
.design-h { padding: 8px 10px; background: var(--bg); display: grid; gap: 2px; }
.design-h strong { font-size: 14px; }
.design-h .codes { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table.sizes { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
table.sizes th, table.sizes td { padding: 5px 8px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
table.sizes th:first-child, table.sizes td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
table.sizes th { font-family: var(--f-display); font-weight: 600; letter-spacing: .04em; }
td.short { color: var(--late); font-weight: 600; }

/* settings */
.vtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.vtable td, .vtable th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.vtable input[type=text], .vtable input[type=number], .field { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 5px; padding: 0 8px; background: var(--bg); }
.vtable input[type=number] { width: 64px; }

/* drop + modal + toast */
.dropzone { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 4px dashed var(--accent); display: grid; place-items: center; pointer-events: none; }
.dropzone div { background: var(--surface); padding: 18px 26px; border-radius: 8px; font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; }
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(10,14,20,.38); }
.modal-card { background: var(--surface); border-radius: 10px; width: min(460px, 100%); padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal-card h2 { margin: 0; font-family: var(--f-display); font-size: 24px; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.stats b { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 6px; font-weight: 600; max-width: calc(100% - 32px); }

@media (max-width: 560px) {
  .brand h1 { font-size: 22px; }
  .search { max-width: none; flex-basis: 100%; order: 5; }
  .seg { flex-basis: 100%; }
  .seg button { padding: 7px 9px; font-size: 13px; }
  .summary .imported { margin-left: 0; flex-basis: 100%; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-row">
    <div class="brand"><h1>J&amp;A POs</h1><span class="sub" id="sub">Loading board…</span></div>
    <input id="q" class="search" type="search" placeholder="Search PO, design, print or item code" aria-label="Search">
    <div class="seg" role="group" aria-label="Status filter" id="seg">
      <button data-f="open" aria-pressed="true">Open</button>
      <button data-f="sent">Not received</button>
      <button data-f="partial">Partial</button>
      <button data-f="eta">With ETA</button>
      <button data-f="done">Received</button>
      <button data-f="cancelled">Cancelled</button>
      <button data-f="all">All</button>
    </div>
    <label class="chk"><input type="checkbox" id="starOnly"> Starred</label>
    <button class="btn primary" id="importBtn" hidden>Import MAS export</button>
    <button class="btn icon-btn" id="settingsBtn" aria-label="Settings" title="Vendors and settings" hidden>⚙</button>
    <span class="who" id="who" hidden></span>
    <button class="btn" id="signOutBtn" hidden>Sign out</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  </div>
</header>

<main>
  <div class="summary" id="summary"></div>
  <div id="board" style="display:grid;gap:14px">
    <div class="empty">
      <h2>Loading purchase orders</h2>
      <p>Open POs to the printers show here, one row per vendor. Import a MAS export to add or update them.</p>
    </div>
  </div>
</main>

<div id="dropzone" class="dropzone" hidden><div>Drop MAS export to import</div></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="signin" class="modal" hidden>
  <form class="modal-card" id="signinForm">
    <h2>J&amp;A POs</h2>
    <p class="hint" style="margin:0">Sign in with the account the board admin set up for you.</p>
    <label for="siEmail">Email<input class="field" type="email" id="siEmail" autocomplete="username" required></label>
    <label for="siPass">Password<input class="field" type="password" id="siPass" autocomplete="current-password" required></label>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn" id="siForgot">Forgot password</button>
      <button class="btn primary" type="submit" id="siSubmit">Sign in</button>
    </div>
    <p class="hint" id="siMsg" style="margin:0" aria-live="polite"></p>
  </form>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=3"></script>
<script src="import-core.js?v=5"></script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const docId = po => String(po).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190) || "_";
const DEFAULT_CFG = { stages: ["Art", "Seps", "Samples", "RFIDs", "UPCs"], warnDays: 30, lateDays: 45 };

const SIZE_ORDER = ["YS","YM","YL","YXL","XS","S","M","L","XL","XX","XXL","2X","2XL","3X","3XL","4X","4XL","5X","5XL","OS","OSFA"];
const SIZES = new Set(SIZE_ORDER);
const DESC_SIZE = /\s+(XS|S|SM|SML|SMALL|M|MD|MED|L|LG|LRG|XL|XXL|XX|2X|2XL|3X|3XL|4X)$/i;
function splitItem(code) {
  code = String(code || "");
  const i = code.lastIndexOf("-");
  if (i > 0) { const s = code.slice(i + 1).toUpperCase(); if (SIZES.has(s)) return [code.slice(0, i), s]; }
  return [code, ""];
}

// ---------- state ----------
const S = {
  db: null, uid: null, email: null, canWrite: false,
  months: new Map(),   // monthId -> {pos}
  notes: new Map(),    // docId -> note
  vendors: new Map(),  // vendorNo -> {name, order, hidden}
  cfg: { ...DEFAULT_CFG },
  lastImport: null,
  loaded: { months: false, vendors: false },
  filter: "open", q: "", starOnly: false,
  openId: null, view: null, // 'po' | 'settings'
  collapsed: new Set(),
};
try { S.collapsed = new Set(JSON.parse(localStorage.getItem("pob.collapsed") || "[]")); } catch {}
try { const f = localStorage.getItem("pob.filter"); if (f) S.filter = f; } catch {}

function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseISO(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function ageDays(iso) { return Math.round((today() - parseISO(iso)) / 864e5); }
function fmtDate(iso) { if (!iso || iso === "undated") return "No date"; const d = parseISO(iso); return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`; }
function fmtShort(iso) { if (!iso || iso === "undated") return "—"; const d = parseISO(iso); return d.getFullYear() === today().getFullYear() ? `${d.getMonth() + 1}/${d.getDate()}` : fmtDate(iso); }
function vendorName(no) { return S.vendors.get(no)?.name || no || "Unknown vendor"; }

// ---------- derive ----------
function allPOs() {
  const out = [];
  for (const [, m] of S.months) for (const [po, r] of Object.entries(m.pos || {})) out.push(derive(po, r));
  return out;
}
function derive(po, r) {
  const n = S.notes.get(docId(po)) || {};
  let ord = 0, rec = 0, bo = 0;
  const groups = new Map();
  for (const ln of r.l || []) {
    const [print, item, desc, line, o, rc, b] = ln;
    ord += +o || 0; rec += +rc || 0; bo += +b || 0;
    const [base, size] = splitItem(item || print);
    let g = groups.get(base);
    if (!g) { g = { base, desc: String(desc || "").replace(DESC_SIZE, "").trim() || base, print: splitItem(print)[0], line, ord: 0, rec: 0, sizes: [] }; groups.set(base, g); }
    g.ord += +o || 0; g.rec += +rc || 0; g.sizes.push({ size: size || "—", ord: +o || 0, rec: +rc || 0 });
  }
  for (const g of groups.values()) g.sizes.sort((a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size));
  // MAS status wins: C = completed (received), X = cancelled. Active orders use the quantities.
  let status = r.s === "X" ? "cancelled" : r.s === "C" ? "received" : rec === 0 ? "sent" : rec < ord ? "partial" : "received";
  if (n.closed && (status === "sent" || status === "partial")) status = "closed";
  const designs = [...groups.values()];
  const titles = [...new Set(designs.map(g => g.desc))];
  return { po, id: docId(po), date: r.d, vendor: r.v, shipTo: r.t || "", ord, rec, bo, status, open: status === "sent" || status === "partial",
    designs, titles, note: n, age: ageDays(r.d), lines: r.l || [] };
}
function ageClass(p) {
  if (!p.open) return "";
  if (p.age >= S.cfg.lateDays) return "late";
  if (p.age >= S.cfg.warnDays) return "warn";
  return "";
}
function matches(p) {
  const f = S.filter;
  if (f === "open" && !p.open) return false;
  if (f === "sent" && p.status !== "sent") return false;
  if (f === "partial" && p.status !== "partial") return false;
  if (f === "done" && !(p.status === "received" || p.status === "closed")) return false;
  if (f === "cancelled" && p.status !== "cancelled") return false;
  if (f === "eta" && !(p.note.eta && p.open)) return false;
  if (S.starOnly && !p.note.star) return false;
  if (S.q) {
    const hay = [p.po, vendorName(p.vendor), p.shipTo, p.note.note, ...p.titles, ...p.lines.map(l => l[0] + " " + l[1])].join(" ").toLowerCase();
    if (!S.q.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

// ---------- render ----------
function render() {
  const pos = allPOs();
  renderSummary(pos);
  renderBoard(pos);
  if (S.view === "po") renderDrawerPO();
}
function renderSummary(pos) {
  const open = pos.filter(p => p.open);
  const sent = open.filter(p => p.status === "sent").length;
  const part = open.filter(p => p.status === "partial").length;
  const late = open.filter(p => p.age >= S.cfg.lateDays).length;
  const etaPast = open.filter(p => p.note.eta && parseISO(p.note.eta) < today()).length;
  const li = S.lastImport;
  const liTxt = li?.at ? `Last import ${new Date(li.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}${li.file ? " · " + esc(li.file) : ""}` : "";
  $("#summary").innerHTML = pos.length ? `
    <span><b>${open.length}</b>open POs</span>
    <span><b>${sent}</b>nothing received</span>
    <span><b>${part}</b>partially received</span>
    <span class="late"><b>${late}</b>sent ${S.cfg.lateDays}+ days ago</span>
    ${etaPast ? `<span class="late"><b>${etaPast}</b>past their ETA</span>` : ""}
    <span class="imported">${liTxt}</span>` : "";
  $("#sub").textContent = pos.length ? `${pos.length} POs tracked` : (S.loaded.months ? "No POs yet" : "Loading board…");
}
function renderBoard(pos) {
  const board = $("#board");
  if (!S.db) {
    board.innerHTML = S.setupMsg || `<div class="empty"><h2>Signed out</h2><p>Sign in to see the board.</p></div>`;
    return;
  }
  if (!S.loaded.months) return;
  if (!pos.length) {
    board.innerHTML = `<div class="empty"><h2>No purchase orders yet</h2><p>Export the printer PO query from MAS as .xlsx or .csv, then drop it anywhere on this page or use Import. Each PO becomes a card in its vendor's row.</p>${S.canWrite ? `<button class="btn primary" data-act="import">Import MAS export</button>` : ""}</div>`;
    return;
  }
  const byV = new Map();
  for (const p of pos) { if (!byV.has(p.vendor)) byV.set(p.vendor, []); byV.get(p.vendor).push(p); }
  const vendorsList = [...byV.keys()].filter(v => !S.vendors.get(v)?.hidden).sort((a, b) => {
    const oa = S.vendors.get(a)?.order ?? 999, ob = S.vendors.get(b)?.order ?? 999;
    return oa - ob || vendorName(a).localeCompare(vendorName(b));
  });
  let html = "";
  let anyShown = false;
  for (const v of vendorsList) {
    const all = byV.get(v);
    const shown = all.filter(matches).sort((a, b) => S.filter === "eta" ? ((a.note.eta || "").localeCompare(b.note.eta || "") || a.po.localeCompare(b.po)) : (a.open && b.open) ? (b.age - a.age || a.po.localeCompare(b.po)) : (b.date.localeCompare(a.date) || b.po.localeCompare(a.po)));
    if ((S.q || S.filter === "eta" || S.filter === "cancelled") && !shown.length) continue;
    anyShown = anyShown || shown.length > 0;
    const open = all.filter(p => p.open);
    const late = open.filter(p => p.age >= S.cfg.lateDays).length;
    const part = open.filter(p => p.status === "partial").length;
    const collapsed = S.collapsed.has(v);
    const cap = S.filter === "done" || S.filter === "all" ? 120 : Infinity;
    html += `<section class="lane" data-collapsed="${collapsed}">
      <button class="lane-head" data-act="lane" data-v="${esc(v)}" aria-expanded="${!collapsed}">
        <span class="caret">▾</span>
        <h2>${esc(vendorName(v))}</h2>${S.vendors.get(v)?.name ? `<span class="vno">${esc(v)}</span>` : ""}
        <span class="counts">
          <span class="pill sent">${open.length} open</span>
          ${part ? `<span class="pill partial">${part} partial</span>` : ""}
          ${late ? `<span class="pill late">${late} late</span>` : ""}
        </span>
      </button>
      ${shown.length ? `<div class="cards">${shown.slice(0, cap).map(card).join("")}</div>${shown.length > cap ? `<div class="lane-empty">Showing the ${cap} most recent of ${shown.length}. Search to find older POs.</div>` : ""}`
        : `<div class="lane-empty">No POs match this filter.</div>`}
    </section>`;
  }
  if (!anyShown && !S.q && S.filter === "cancelled") html = `<div class="empty"><h2>No cancelled orders</h2><p>Orders that were on the board and later come through the MAS export as cancelled (X) show here.</p></div>`;
  else if (!anyShown && !S.q && S.filter === "eta") html = `<div class="empty"><h2>No ETAs yet</h2><p>Open a PO and pick a date under ETA. Orders with an ETA show here, soonest first.</p></div>`;
  else if (!anyShown && S.q) html = `<div class="empty"><h2>No matches</h2><p>Nothing matches “${esc(S.q)}” under this filter. Try All, or check the PO number.</p></div>` + html;
  board.innerHTML = html;
}
function card(p) {
  const pct = p.ord ? Math.min(100, Math.round(p.rec / p.ord * 100)) : 0;
  const ac = ageClass(p);
  const stages = (p.note.stages || []).filter(s => S.cfg.stages.includes(s));
  const statusTxt = p.status === "received" ? "Received" : p.status === "closed" ? "Closed" : p.status === "cancelled" ? "Cancelled" : `${p.age}d ago`;
  const eta = p.note.eta;
  const etaPast = eta && p.open && parseISO(eta) < today();
  return `<button class="card ${p.open ? "" : "done"}" data-act="open" data-po="${esc(p.po)}">
    <div class="c-top"><span class="c-po">${esc(p.po)}</span>${p.note.star ? `<span class="c-star" title="Starred">★</span>` : ""}</div>
    <div class="c-title">${esc(p.titles[0] || "—")}</div>
    ${p.shipTo ? `<div class="c-ship" title="Ship to ${esc(p.shipTo)}">Ship to ${esc(p.shipTo)}</div>` : ""}
    ${p.titles.length > 1 ? `<div class="c-more">+${p.titles.length - 1} more ${p.designs.some(g => g.print) ? "design" : "item"}${p.titles.length > 2 ? "s" : ""}</div>` : ""}
    <div class="meter ${pct >= 100 ? "full" : ""}" title="${p.rec} of ${p.ord} received"><i style="width:${pct}%"></i></div>
    <div class="c-foot"><span>Sent ${fmtShort(p.date)}</span><span class="age ${ac}">${statusTxt}</span><span class="qty">${p.rec}/${p.ord}</span></div>
    ${eta && p.open ? `<div class="c-eta ${etaPast ? "past" : ""}" title="${etaPast ? "ETA has passed" : "Expected arrival"}">ETA ${fmtShort(eta)}${etaPast ? " · passed" : ""}</div>` : ""}
    ${stages.length ? `<div class="c-stages">${stages.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>` : ""}
    ${p.note.note ? `<div class="c-note">${esc(p.note.note)}</div>` : ""}
  </button>`;
}

  for (const [, m] of S.months) if (m.pos && Object.prototype.hasOwnProperty.call(m.pos, po)) return m.pos[po];

}
function findPO(po) {
  for (const [, m] of S.months) if (m.pos && Object.prototype.hasOwnProperty.call(m.pos, po)) return derive(po, m.pos[po]);
  return null;
}

async function saveSettings() {
  const rows = [...document.querySelectorAll(".vtable tr[data-no]")];
  try {
    for (const tr of rows) {
      const no = tr.dataset.no, cur = S.vendors.get(no) || {};
      const next = { name: $(".vn", tr).value.trim(), order: Number($(".vo", tr).value) || 0, hidden: !$(".vh", tr).checked };
      if (next.name !== (cur.name || "") || next.order !== (cur.order ?? 50) || next.hidden !== !!cur.hidden) await S.db.doc("vendors/" + docId(no)).set({ ...next, no });
    }
    const stages = $("#cfgStages").value.split(",").map(s => s.trim()).filter(Boolean);
    const cfg = { stages: stages.length ? stages : DEFAULT_CFG.stages, warnDays: Math.max(1, +$("#cfgWarn").value || 30), lateDays: Math.max(1, +$("#cfgLate").value || 45) };
    if (JSON.stringify(cfg) !== JSON.stringify(S.cfg)) await S.db.doc("settings/board").set(cfg);
    toast("Settings saved");
    closeDrawer();
  } catch (e) { toast(writeErr(e)); }
}

function openDrawer(view, po) {
  S.view = view; S.openId = po || null;
  $("#drawer").hidden = false; $("#scrim").hidden = false;
  view === "po" ? renderDrawerPO() : renderSettings();
}
function closeDrawer() { S.view = null; S.openId = null; $("#drawer").hidden = true; $("#scrim").hidden = true; }

// ---------- notes ----------
const noteQueue = new Map();
function writeNote(po, patch) {
  const id = docId(po);
  const cur = S.notes.get(id) || {};
  const next = { ...cur, ...patch, po, by: S.uid || null, byName: S.email || null, at: new Date().toISOString() };
  S.notes.set(id, next); render();
  const prev = noteQueue.get(id) || Promise.resolve();
  const p = prev.then(() => S.db.doc("notes/" + id).set(next)).catch(e => toast(writeErr(e)));
  noteQueue.set(id, p);
  return p;
}
function writeErr(e) {
  if (e?.code === "permission-denied") return "Your account isn't on the board's access list. Ask the board admin to add your email.";
  if (e?.code === "resource-exhausted") return "The board's storage is full. Old received POs need clearing out.";
  console.error("Save failed", e);
  const detail = e?.code || e?.message || String(e);
  return `Couldn't save (${String(detail).slice(0, 140)}). Try again; if it keeps happening, send this message to whoever set up the board.`;
}

// ---------- import ----------
async function parseFile(file) {
  if (!window.XLSX) throw new Error("The spreadsheet reader didn't load. Reload the page and try again.");
  const isText = /\.(csv|txt)$/i.test(file.name);
  // CSV is read as plain text; Excel dates arrive as serial numbers. ImportCore handles both.
  const wb = XLSX.read(await file.arrayBuffer(), isText ? { type: "array", raw: true } : { type: "array" });
  // Every sheet is read (e.g. "Tees POs" and "Other POs"); sheets without PO rows are ignored.
  const sheets = wb.SheetNames.map(name => ({ name, rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null }) }));
  return ImportCore.sheetsToIncoming(sheets);
}
const planImport = incoming => ImportCore.planImport(incoming, S.months, S.vendors);
let pending = null;
async function handleFile(file) {
  if (!file) return;
  if (!S.canWrite) { toast("You don't have access to import into this board."); return; }
  try {
    const { incoming, rows, sheets } = await parseFile(file);
    const plan = planImport(incoming);
    pending = { incoming, rows, plan, file: file.name, sheets };
    showImportModal();
  } catch (e) { toast(e.message || "Couldn't read that file."); }
}
function showImportModal(busy = "") {
  const { plan, incoming, rows, file, sheets } = pending;
  const m = $("#modal");
  m.hidden = false;
  m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">
    <h2>Import ${esc(file)}</h2>
    <p class="hint" style="margin:0">${rows} lines on ${incoming.size} POs${sheets && sheets.length > 1 ? ` from ${sheets.map(esc).join(" and ")}` : ""}. Notes, stars and steps already on the board are kept.</p>
    <div class="stats"><div><b>${plan.added}</b><span>new active POs</span></div><div><b>${plan.changed}</b><span>updated</span></div><div><b>${plan.same}</b><span>unchanged</span></div></div>
    ${plan.toCompleted || plan.toCancelled ? `<p class="hint" style="margin:0">Of the updates, ${plan.toCompleted} will move to Received (completed in MAS)${plan.toCancelled ? ` and ${plan.toCancelled} to Cancelled` : ""}.</p>` : ""}
    ${plan.skipped ? `<p class="hint" style="margin:0">Skipped ${plan.skipped} PO${plan.skipped === 1 ? "" : "s"} that ${plan.skipped === 1 ? "isn't" : "aren't"} on the board and ${plan.skipped === 1 ? "is" : "are"} already ${plan.skippedCancelled && plan.skippedCompleted ? "completed or cancelled" : plan.skippedCancelled ? "cancelled" : "completed"} in MAS.</p>` : ""}
    ${plan.newVendors.length ? `<p class="hint" style="margin:0">New vendor numbers: <span class="mono">${plan.newVendors.map(esc).join(", ")}</span>. Name them in Settings after importing.</p>` : ""}
    <div class="row" style="justify-content:flex-end">
      <button class="btn" data-act="cancelImport" ${busy ? "disabled" : ""}>Cancel</button>
      <button class="btn primary" data-act="applyImport" ${busy || !(plan.added + plan.changed) ? "disabled" : ""}>${busy || (plan.added + plan.changed ? "Import" : "Nothing to import")}</button>
    </div></div>`;
}
async function applyImport() {
  const { incoming, plan, rows, file } = pending;
  showImportModal("Importing…");
  try {
    const next = ImportCore.buildMonthWrites(incoming, plan, S.months);
    for (const [mid, pos] of next) await S.db.doc("po_months/" + mid).set({ pos: ImportCore.toStorePos(pos), updatedAt: new Date().toISOString() });
    await S.db.doc("settings/lastImport").set({ at: new Date().toISOString(), file, rows, pos: incoming.size, added: plan.added, changed: plan.changed, skipped: plan.skipped, by: S.uid || null, byName: S.email || null, source: "web" });
    $("#modal").hidden = true; pending = null;
    toast(`Imported: ${plan.added} new, ${plan.changed} updated`);
  } catch (e) { $("#modal").hidden = true; pending = null; toast(writeErr(e)); }
}

// ---------- ui plumbing ----------
let toastT;

function applyWriteUI() {

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "open") openDrawer("po", el.dataset.po);
  else if (a === "close") closeDrawer();
  else if (a === "lane") {
    const v = el.dataset.v; S.collapsed.has(v) ? S.collapsed.delete(v) : S.collapsed.add(v);
    try { localStorage.setItem("pob.collapsed", JSON.stringify([...S.collapsed])); } catch {}
    render();
  }
  else if (a === "import") $("#file").click();
  else if (a === "star") { const p = findPO(S.openId); writeNote(p.po, { star: !p.note.star }); }
  else if (a === "stage") { const p = findPO(S.openId); const s = el.dataset.s; const cur = new Set(p.note.stages || []); cur.has(s) ? cur.delete(s) : cur.add(s); writeNote(p.po, { stages: [...cur] }); }
  else if (a === "saveNote") { const p = findPO(S.openId); const v = $("#noteText").value.trim(); if (v !== (p.note.note || "")) writeNote(p.po, { note: v }).then(() => toast("Note saved")); $("#noteText").blur(); renderDrawerPO(); }
  else if (a === "clearEta") { const p = findPO(S.openId); writeNote(p.po, { eta: "" }).then(() => toast("ETA cleared")); }
  else if (a === "closePO") { const p = findPO(S.openId); writeNote(p.po, { closed: !p.note.closed }); }
  else if (a === "saveSettings") saveSettings();
  else if (a === "cancelImport") { pending = null; $("#modal").hidden = true; }
  else if (a === "applyImport") applyImport();
});
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("change", e => {
  if (e.target.id !== "etaInput" || !S.canWrite) return;
  const p = findPO(S.openId); if (!p) return;
  const v = e.target.value;
  if (v === (p.note.eta || "") || (v && !/^\d{4}-\d{2}-\d{2}$/.test(v))) return;
  writeNote(p.po, { eta: v }).then(() => toast(v ? `ETA set to ${fmtDate(v)}` : "ETA cleared"));
  e.target.blur();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#modal").hidden && pending) { pending = null; $("#modal").hidden = true; } else closeDrawer(); } });
$("#importBtn").addEventListener("click", () => $("#file").click());
$("#settingsBtn").addEventListener("click", () => openDrawer("settings"));
$("#file").addEventListener("change", e => { handleFile(e.target.files[0]); e.target.value = ""; });
let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); render(); }, 120); });
$("#starOnly").addEventListener("change", e => { S.starOnly = e.target.checked; render(); });
function syncSeg() { document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === S.filter)); }
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.filter = b.dataset.f; try { localStorage.setItem("pob.filter", S.filter); } catch {} syncSeg(); render(); });
syncSeg();

let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e) || !S.canWrite) return; e.preventDefault(); dragDepth++; $("#dropzone").hidden = false; });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#dropzone").hidden = true; } });
window.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $("#dropzone").hidden = true; handleFile(e.dataTransfer.files[0]); });

// ---------- boot (Firebase) ----------
let unsubs = [];
function lostAccess(e) {
  if (e?.code === "permission-denied") {
    S.setupMsg = `<div class="empty"><h2>No access yet</h2><p>You're signed in as ${esc(S.email)}, but that email isn't on the board's access list. Ask the board admin to add it.</p></div>`;
    S.db = null; S.canWrite = false; applyWriteUI(); render();
  } else toast("Lost connection to the board. Reload to reconnect.");
}
function startData() {
  const db = S.db;
  unsubs = [
    db.collection("po_months").onSnapshot(snap => { S.months = new Map(snap.docs.map(d => { const x = d.data(); return [d.id, { ...x, pos: ImportCore.fromStorePos(x.pos) }]; })); S.loaded.months = true; render(); }, lostAccess),
    db.collection("notes").onSnapshot(snap => { S.notes = new Map(snap.docs.map(d => [d.id, d.data()])); render(); }, lostAccess),
    db.collection("vendors").onSnapshot(snap => { S.vendors = new Map(snap.docs.map(d => { const v = d.data(); return [v.no || d.id, v]; })); render(); }, lostAccess),
    db.doc("settings/board").onSnapshot(d => { S.cfg = { ...DEFAULT_CFG, ...(d.exists ? d.data() : {}) }; render(); }, lostAccess),
    db.doc("settings/lastImport").onSnapshot(d => { S.lastImport = d.exists ? d.data() : null; render(); }, lostAccess),
  ];
}
function boot() {
  const cfg = window.FIREBASE_CONFIG;
  if (window.ImportCore && !window.ImportCore.sheetsToIncoming) { S.setupMsg = `<div class="empty"><h2>Update loading</h2><p>An older copy of the board is cached. Reload the page in a minute (Ctrl + F5).</p></div>`; S.loaded.months = true; render(); return; }
  if (!window.firebase || !window.ImportCore || !cfg || !cfg.apiKey || /^PASTE/.test(cfg.apiKey)) {
    S.setupMsg = `<div class="empty"><h2>Not connected yet</h2><p>Paste your Firebase project settings into firebase-config.js. The README walks through it.</p></div>`;
    S.loaded.months = true; render(); return;
  }
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  const auth = firebase.auth();
  const msg = t => { $("#siMsg").textContent = t; };
  $("#signinForm").addEventListener("submit", async e => {
    e.preventDefault(); msg("Signing in…"); $("#siSubmit").disabled = true;
    try { await auth.signInWithEmailAndPassword($("#siEmail").value.trim(), $("#siPass").value); msg(""); }
    catch (err) {
      msg(err.code === "auth/too-many-requests" ? "Too many tries. Wait a few minutes or reset your password."
        : err.code === "auth/network-request-failed" ? "Can't reach the sign-in service. Check your connection."
        : "That email and password don't match an account on this board.");
    } finally { $("#siSubmit").disabled = false; }
  });
  $("#siForgot").addEventListener("click", async () => {
    const email = $("#siEmail").value.trim();
    if (!email) { msg("Type your email above first, then click Forgot password."); return; }
    try { await auth.sendPasswordResetEmail(email); } catch {}
    msg(`If ${email} has an account, a reset link is on its way.`);
  });
  $("#signOutBtn").addEventListener("click", () => auth.signOut());
  auth.onAuthStateChanged(u => {
    unsubs.forEach(f => f()); unsubs = [];
    S.months = new Map(); S.notes = new Map(); S.loaded.months = false; S.setupMsg = "";
    if (!u) {
      S.db = null; S.uid = null; S.email = null; S.canWrite = false;
      $("#signin").hidden = false; applyWriteUI(); closeDrawer(); render(); return;
    }
    $("#signin").hidden = true;
    S.uid = u.uid; S.email = u.email; S.canWrite = true; applyWriteUI();
    S.db = { collection: p => fs.collection(p), doc: p => fs.doc(p) };
    startData();
  });
}
boot();
})();
</script>
</body>
</html>
